<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🎯 DUELO DE PROBLEMAS - PRÁCTICA</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; /* Quita el resaltado al tocar en móvil */
        }
        
        body { 
            font-family: 'Segoe UI', sans-serif;
            background: #1a2a3a;
            padding: 8px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ecf0f1;
            border-radius: 20px;
            padding: 15px;
        }
        
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: clamp(1.5rem, 5vw, 2rem); /* Tamaño responsive */
        }
        
        .modo-badge {
            text-align: center;
            font-size: 1.1em;
            margin-bottom: 10px;
            color: #27ae60;
            font-weight: bold;
        }
        
        .conexion {
            text-align: center;
            margin-bottom: 15px;
            padding: 12px;
            background: #fff;
            border-radius: 40px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }
        
        .conectado { color: #27ae60; font-weight: bold; }
        .desconectado { color: #e74c3c; font-weight: bold; }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 30px;
            background: #3498db;
            color: white;
            font-weight: bold;
            cursor: pointer;
            min-width: 100px;
            font-size: 16px; /* Tamaño mínimo para evitar zoom en iOS */
            transition: opacity 0.2s;
            -webkit-appearance: none; /* Quita estilo por defecto en iOS */
        }
        
        button:hover { 
            opacity: 0.9; 
        }
        
        button:active {
            transform: scale(0.98); /* Efecto al tocar */
        }
        
        button:disabled { 
            background: #bdc3c7; 
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        .registro {
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        
        .registro input {
            padding: 15px;
            width: 100%;
            max-width: 300px;
            margin: 10px 0;
            border: 2px solid #3498db;
            border-radius: 30px;
            font-size: 16px;
        }
        
        .juego-panel {
            display: none;
        }
        
        .header-info {
            display: flex;
            justify-content: space-between;
            background: #fff;
            padding: 12px;
            border-radius: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 14px;
        }
        
        .badge {
            background: #3498db;
            color: white;
            padding: 6px 12px;
            border-radius: 25px;
            font-weight: bold;
            display: inline-block;
        }
        
        .badge-fallos {
            background: #e74c3c;
        }
        
        .badge-aciertos {
            background: #27ae60;
        }
        
        .main-content {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .tablero-container {
            flex: 2;
            min-width: 300px;
            background: #fff;
            padding: 15px;
            border-radius: 15px;
        }
        
        /* ============================================ */
        /* TABLERO CON COORDENADAS - VERSIÓN MÓVIL      */
        /* ============================================ */
        .tablero-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        
        .coordenadas-superiores,
        .coordenadas-inferiores {
            display: flex;
            width: 100%;
            padding-left: 25px; /* Espacio para coordenadas izquierdas */
            font-size: clamp(12px, 3vw, 16px);
            font-weight: bold;
            color: #8b4513;
        }
        
        .tablero-con-coordenadas {
            display: flex;
            width: 100%;
        }
        
        .coordenadas-izquierdas,
        .coordenadas-derechas {
            display: flex;
            flex-direction: column;
            width: 25px;
            justify-content: space-around;
            font-size: clamp(12px, 3vw, 16px);
            font-weight: bold;
            color: #8b4513;
            text-align: center;
        }
        
        .coordenadas-izquierdas {
            margin-right: 5px;
        }
        
        .coordenadas-derechas {
            margin-left: 5px;
        }
        
        .coordenada-superior,
        .coordenada-inferior {
            flex: 1;
            text-align: center;
        }
        
        .coordenada-izquierda,
        .coordenada-derecha {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #tablero {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            border: 3px solid #8b4513;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 1;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .casilla {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }
        
        .casilla img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 3px;
            pointer-events: auto;
            max-width: 100%;
        }
        
        .casilla.blanca { background: #f0d9b5; }
        .casilla.negra { background: #b58863; }
        
        .casilla:active {
            opacity: 0.8;
        }
        
        .panel-derecho {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .info-problema {
            background: #fff;
            padding: 15px;
            border-radius: 15px;
        }
        
        .info-problema h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        
        .info-problema p {
            font-size: 15px;
            line-height: 1.4;
        }
        
        .turno-indicador {
            background: #f39c12;
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1em;
            text-align: center;
            margin-top: 12px;
        }
        
        .contador-fallos {
            background: #fff;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }
        
        .progreso-fallos {
            width: 100%;
            height: 25px;
            background: #ecf0f1;
            border-radius: 15px;
            margin: 12px 0;
            overflow: hidden;
        }
        
        .barra-fallos {
            height: 100%;
            background: #e74c3c;
            transition: width 0.3s;
        }
        
        .chat {
            background: #fff;
            padding: 15px;
            border-radius: 15px;
            height: 250px;
            display: flex;
            flex-direction: column;
        }
        
        #mensajes {
            flex: 1;
            overflow-y: auto;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 14px;
            -webkit-overflow-scrolling: touch; /* Scroll suave en iOS */
        }
        
        .mensaje {
            padding: 8px 12px;
            margin: 5px 0;
            background: #e9ecef;
            border-radius: 18px;
            word-wrap: break-word;
        }
        
        .mensaje.sistema {
            background: #d4edda;
            color: #155724;
        }
        
        .ranking {
            background: #fff;
            padding: 15px;
            border-radius: 15px;
            display: none;
        }
        
        .ranking h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        .ranking-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 8px;
            border-bottom: 1px solid #ddd;
            font-size: 15px;
        }
        
        .botones-panel {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .btn-practica {
            background: #27ae60;
            flex: 2;
            min-width: 150px;
        }
        
        .btn-finalizar {
            background: #e74c3c;
            flex: 1;
            min-width: 120px;
        }
        
        /* ============================================ */
        /* MEDIA QUERIES - AJUSTES PARA MÓVIL           */
        /* ============================================ */
        @media (max-width: 768px) {
            body {
                padding: 5px;
            }
            
            .container {
                padding: 12px;
            }
            
            h1 {
                font-size: 1.8rem;
                margin-bottom: 12px;
            }
            
            .conexion {
                padding: 10px;
                gap: 8px;
            }
            
            button {
                padding: 12px 16px;
                min-width: 90px;
                font-size: 15px;
            }
            
            .header-info {
                font-size: 13px;
                padding: 10px;
            }
            
            .badge {
                padding: 5px 10px;
            }
            
            .tablero-container {
                padding: 12px;
            }
            
            .coordenadas-izquierdas,
            .coordenadas-derechas {
                width: 20px;
                font-size: 12px;
            }
            
            .coordenadas-superiores,
            .coordenadas-inferiores {
                padding-left: 20px;
                font-size: 12px;
            }
            
            #tablero {
                border-width: 2px;
            }
            
            .casilla img {
                padding: 2px;
            }
            
            .panel-derecho {
                gap: 12px;
            }
            
            .info-problema h3 {
                font-size: 16px;
            }
            
            .info-problema p {
                font-size: 14px;
            }
            
            .turno-indicador {
                padding: 10px;
                font-size: 1rem;
            }
            
            .contador-fallos h4 {
                font-size: 16px;
            }
            
            .chat {
                height: 200px;
            }
            
            .botones-panel {
                flex-direction: column;
            }
            
            .btn-practica,
            .btn-finalizar {
                width: 100%;
            }
        }
        
        /* Ajustes para pantallas muy pequeñas (menos de 400px) */
        @media (max-width: 400px) {
            .header-info {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            
            .coordenadas-izquierdas,
            .coordenadas-derechas {
                width: 18px;
                font-size: 11px;
            }
            
            .coordenadas-superiores,
            .coordenadas-inferiores {
                padding-left: 18px;
                font-size: 11px;
            }
            
            .casilla img {
                padding: 1px;
            }
            
            .badge {
                width: 100%;
                text-align: center;
            }
        }
        
        /* Orientación horizontal en móvil */
        @media (max-width: 900px) and (orientation: landscape) {
            .main-content { 
                flex-direction: row; 
            }
            
            .tablero-container { 
                min-width: 300px; 
            }
            
            #tablero {
                max-width: 350px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>♜ DUELO DE PROBLEMAS ♞</h1>
        <div id="modoInfo" class="modo-badge">🎯 MODO PRÁCTICA</div>
        
        <div class="conexion">
            <span>Estado: <span id="estado" class="desconectado">Desconectado</span></span>
            <button id="btnConectar">Conectar</button>
            <button id="btnDesconectar" disabled>Desconectar</button>
        </div>
        
        <div id="registro" class="registro">
            <h3>Registro</h3>
            <input type="text" id="nombreInput" placeholder="Tu nombre" value="Jugador">
            <button id="btnRegistrar">Registrarse</button>
        </div>
        
        <div id="juegoPanel" class="juego-panel">
            <div class="header-info">
                <div><strong>ID:</strong> <span id="miId">-</span></div>
                <div><strong>Nombre:</strong> <span id="miNombre">-</span></div>
                <div><span class="badge">Puntos: <span id="puntuacion">0</span></span></div>
                <div><span class="badge badge-aciertos">✓ <span id="aciertos">0</span></span></div>
                <div><span class="badge badge-fallos">✗ <span id="fallos">0</span>/<span id="fallosMaximos">3</span></span></div>
            </div>
            
            <div class="main-content">
                <div class="tablero-container">
                    <!-- TABLERO CON COORDENADAS -->
                    <div class="tablero-wrapper">
                        <!-- Coordenadas superiores (a-h) -->
                        <div class="coordenadas-superiores" id="coordsSuperiores">
                            <div class="coordenada-superior">a</div>
                            <div class="coordenada-superior">b</div>
                            <div class="coordenada-superior">c</div>
                            <div class="coordenada-superior">d</div>
                            <div class="coordenada-superior">e</div>
                            <div class="coordenada-superior">f</div>
                            <div class="coordenada-superior">g</div>
                            <div class="coordenada-superior">h</div>
                        </div>
                        
                        <div class="tablero-con-coordenadas">
                            <!-- Coordenadas izquierdas (8-1) -->
                            <div class="coordenadas-izquierdas" id="coordsIzquierdas">
                                <div class="coordenada-izquierda">8</div>
                                <div class="coordenada-izquierda">7</div>
                                <div class="coordenada-izquierda">6</div>
                                <div class="coordenada-izquierda">5</div>
                                <div class="coordenada-izquierda">4</div>
                                <div class="coordenada-izquierda">3</div>
                                <div class="coordenada-izquierda">2</div>
                                <div class="coordenada-izquierda">1</div>
                            </div>
                            
                            <!-- Tablero -->
                            <div id="tablero"></div>
                            
                            <!-- Coordenadas derechas (8-1) -->
                            <div class="coordenadas-derechas" id="coordsDerechas">
                                <div class="coordenada-derecha">8</div>
                                <div class="coordenada-derecha">7</div>
                                <div class="coordenada-derecha">6</div>
                                <div class="coordenada-derecha">5</div>
                                <div class="coordenada-derecha">4</div>
                                <div class="coordenada-derecha">3</div>
                                <div class="coordenada-derecha">2</div>
                                <div class="coordenada-derecha">1</div>
                            </div>
                        </div>
                        
                        <!-- Coordenadas inferiores (a-h) -->
                        <div class="coordenadas-inferiores" id="coordsInferiores">
                            <div class="coordenada-inferior">a</div>
                            <div class="coordenada-inferior">b</div>
                            <div class="coordenada-inferior">c</div>
                            <div class="coordenada-inferior">d</div>
                            <div class="coordenada-inferior">e</div>
                            <div class="coordenada-inferior">f</div>
                            <div class="coordenada-inferior">g</div>
                            <div class="coordenada-inferior">h</div>
                        </div>
                    </div>
                    
                    <div class="botones-panel">
                        <button id="btnIniciarPractica" class="btn-practica">Iniciar Práctica</button>
                        <button id="btnFinalizar" class="btn-finalizar">Finalizar</button>
                    </div>
                </div>
                
                <div class="panel-derecho">
                    <div class="info-problema">
                        <h3>Problema</h3>
                        <p id="problemaDesc">Esperando...</p>
                        
                        <!-- TURNO -->
                        <div id="turnoDisplay" class="turno-indicador">⚪ Juegan blancas</div>
                    </div>
                    
                    <div class="contador-fallos">
                        <h4>Fallos permitidos</h4>
                        <div class="progreso-fallos">
                            <div id="barraFallos" class="barra-fallos" style="width: 0%"></div>
                        </div>
                        <span id="fallosDisplay">0/3</span>
                    </div>
                    
                    <div class="chat">
                        <h3>Eventos</h3>
                        <div id="mensajes"></div>
                    </div>
                    
                    <div id="ranking" class="ranking">
                        <h3>Ranking</h3>
                        <div id="listaJugadores"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="app.js"></script>
</body>
</html>

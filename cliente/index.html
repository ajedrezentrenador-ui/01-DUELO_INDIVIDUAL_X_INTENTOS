<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🎯 DUELO DE PROBLEMAS - PRÁCTICA</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            font-family: 'Segoe UI', sans-serif;
            background: #1a2a3a;
            padding: 5px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ecf0f1;
            border-radius: 20px;
            padding: 12px;
        }
        
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: clamp(1.3rem, 4vw, 2rem);
        }
        
        .modo-badge {
            text-align: center;
            font-size: 1rem;
            margin-bottom: 8px;
            color: #27ae60;
            font-weight: bold;
        }
        
        .conexion {
            text-align: center;
            margin-bottom: 12px;
            padding: 10px;
            background: #fff;
            border-radius: 40px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }
        
        .conectado { color: #27ae60; font-weight: bold; }
        .desconectado { color: #e74c3c; font-weight: bold; }
        
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 30px;
            background: #3498db;
            color: white;
            font-weight: bold;
            cursor: pointer;
            min-width: 90px;
            font-size: 15px;
            transition: opacity 0.2s;
            -webkit-appearance: none;
        }
        
        button:active {
            transform: scale(0.97);
        }
        
        button:disabled { 
            background: #bdc3c7; 
            cursor: not-allowed;
        }
        
        .registro {
            background: #fff;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            text-align: center;
            display: none;
        }
        
        .registro input {
            padding: 12px;
            width: 100%;
            max-width: 280px;
            margin: 8px 0;
            border: 2px solid #3498db;
            border-radius: 30px;
            font-size: 16px;
        }
        
        .juego-panel {
            display: none;
        }
        
        .header-info {
            display: flex;
            justify-content: space-between;
            background: #fff;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 13px;
        }
        
        .badge {
            background: #3498db;
            color: white;
            padding: 5px 10px;
            border-radius: 25px;
            font-weight: bold;
            display: inline-block;
            font-size: 12px;
        }
        
        .badge-fallos { background: #e74c3c; }
        .badge-aciertos { background: #27ae60; }
        
        .main-content {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .tablero-container {
            flex: 2;
            min-width: 280px;
            background: #fff;
            padding: 12px;
            border-radius: 15px;
        }
        
        /* ============================================ */
        /* TABLERO COMPACTO - COORDENADAS DENTRO        */
        /* ============================================ */
        .tablero-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        
        #tablero {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            border: 3px solid #8b4513;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 1;
            width: 100%;
            max-width: min(500px, 85vw);
            margin: 0 auto;
            position: relative;
        }
        
        .casilla {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }
        
        .casilla img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 2px;
            pointer-events: auto;
            z-index: 2;
        }
        
        .casilla.blanca { background: #f0d9b5; }
        .casilla.negra { background: #b58863; }
        
        /* Coordenadas DENTRO de las casillas */
        .casilla::after {
            content: attr(data-coordenada);
            position: absolute;
            bottom: 1px;
            right: 2px;
            font-size: 9px;
            font-weight: bold;
            color: rgba(0, 0, 0, 0.4);
            pointer-events: none;
            z-index: 1;
            text-shadow: 0 0 2px rgba(255, 255, 255, 0.5);
        }
        
        /* Para casillas oscuras, texto más claro */
        .casilla.negra::after {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .panel-derecho {
            flex: 1;
            min-width: 240px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .info-problema {
            background: #fff;
            padding: 12px;
            border-radius: 12px;
        }
        
        .info-problema h3 {
            font-size: 16px;
            margin-bottom: 6px;
        }
        
        .info-problema p {
            font-size: 14px;
            line-height: 1.3;
        }
        
        .turno-indicador {
            background: #f39c12;
            color: white;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
            margin-top: 10px;
        }
        
        .contador-fallos {
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }
        
        .progreso-fallos {
            width: 100%;
            height: 20px;
            background: #ecf0f1;
            border-radius: 10px;
            margin: 8px 0;
            overflow: hidden;
        }
        
        .barra-fallos {
            height: 100%;
            background: #e74c3c;
            transition: width 0.3s;
        }
        
        .chat {
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            height: 200px;
            display: flex;
            flex-direction: column;
        }
        
        #mensajes {
            flex: 1;
            overflow-y: auto;
            background: #f8f9fa;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 13px;
            -webkit-overflow-scrolling: touch;
        }
        
        .mensaje {
            padding: 6px 10px;
            margin: 4px 0;
            background: #e9ecef;
            border-radius: 15px;
            word-wrap: break-word;
        }
        
        .mensaje.sistema {
            background: #d4edda;
            color: #155724;
        }
        
        .ranking {
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            display: none;
        }
        
        .ranking h3 {
            font-size: 16px;
            margin-bottom: 8px;
        }
        
        .ranking-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 6px;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }
        
        .botones-panel {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        
        .btn-practica {
            background: #27ae60;
            flex: 2;
            min-width: 130px;
        }
        
        .btn-finalizar {
            background: #e74c3c;
            flex: 1;
            min-width: 100px;
        }
        
        /* ============================================ */
        /* MEDIA QUERIES - MÓVIL                        */
        /* ============================================ */
        @media (max-width: 768px) {
            body {
                padding: 3px;
            }
            
            .container {
                padding: 8px;
            }
            
            h1 {
                font-size: 1.5rem;
                margin-bottom: 8px;
            }
            
            .header-info {
                font-size: 12px;
                padding: 8px;
            }
            
            .badge {
                padding: 4px 8px;
                font-size: 11px;
            }
            
            #tablero {
                max-width: min(450px, 90vw);
                border-width: 2px;
            }
            
            .casilla::after {
                font-size: 8px;
                bottom: 1px;
                right: 1px;
            }
            
            .panel-derecho {
                gap: 10px;
            }
            
            .botones-panel {
                flex-direction: column;
            }
            
            .btn-practica,
            .btn-finalizar {
                width: 100%;
                padding: 14px;
                font-size: 16px;
            }
        }
        
        /* Móviles muy pequeños */
        @media (max-width: 380px) {
            #tablero {
                max-width: 95vw;
            }
            
            .casilla::after {
                font-size: 7px;
            }
            
            .header-info {
                flex-direction: column;
                align-items: center;
                gap: 4px;
            }
            
            .badge {
                width: 100%;
                text-align: center;
            }
        }
        
        /* Orientación horizontal */
        @media (max-width: 900px) and (orientation: landscape) {
            .main-content { 
                flex-direction: row; 
            }
            
            .tablero-container { 
                min-width: 280px; 
            }
            
            #tablero {
                max-width: 350px;
            }
            
            .casilla::after {
                font-size: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>♜ DUELO DE PROBLEMAS ♞</h1>
        <div id="modoInfo" class="modo-badge">🎯 MODO PRÁCTICA</div>
        
        <div class="conexion">
            <span>Estado: <span id="estado" class="desconectado">Desconectado</span></span>
            <button id="btnConectar">Conectar</button>
            <button id="btnDesconectar" disabled>Desconectar</button>
        </div>
        
        <div id="registro" class="registro">
            <h3>Registro</h3>
            <input type="text" id="nombreInput" placeholder="Tu nombre" value="Jugador">
            <button id="btnRegistrar">Registrarse</button>
        </div>
        
        <div id="juegoPanel" class="juego-panel">
            <div class="header-info">
                <div><strong>ID:</strong> <span id="miId">-</span></div>
                <div><strong>Nombre:</strong> <span id="miNombre">-</span></div>
                <div><span class="badge">Puntos: <span id="puntuacion">0</span></span></div>
                <div><span class="badge badge-aciertos">✓ <span id="aciertos">0</span></span></div>
                <div><span class="badge badge-fallos">✗ <span id="fallos">0</span>/<span id="fallosMaximos">3</span></span></div>
            </div>
            
            <div class="main-content">
                <div class="tablero-container">
                    <!-- TABLERO - SIN COORDENADAS EXTERNAS -->
                    <div class="tablero-wrapper">
                        <div id="tablero"></div>
                    </div>
                    
                    <div class="botones-panel">
                        <button id="btnIniciarPractica" class="btn-practica">Iniciar Práctica</button>
                        <button id="btnFinalizar" class="btn-finalizar">Finalizar</button>
                    </div>
                </div>
                
                <div class="panel-derecho">
                    <div class="info-problema">
                        <h3>Problema</h3>
                        <p id="problemaDesc">Esperando...</p>
                        
                        <!-- TURNO -->
                        <div id="turnoDisplay" class="turno-indicador">⚪ Juegan blancas</div>
                    </div>
                    
                    <div class="contador-fallos">
                        <h4>Fallos permitidos</h4>
                        <div class="progreso-fallos">
                            <div id="barraFallos" class="barra-fallos" style="width: 0%"></div>
                        </div>
                        <span id="fallosDisplay">0/3</span>
                    </div>
                    
                    <div class="chat">
                        <h3>Eventos</h3>
                        <div id="mensajes"></div>
                    </div>
                    
                    <div id="ranking" class="ranking">
                        <h3>Ranking</h3>
                        <div id="listaJugadores"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
